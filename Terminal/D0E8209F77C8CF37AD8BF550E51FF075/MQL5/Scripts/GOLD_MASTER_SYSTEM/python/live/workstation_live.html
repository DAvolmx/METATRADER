<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLD MASTER · En vivo</title>
<style>
  :root{--bg:#0e1117;--bg2:#131722;--panel:#1b2130;--line:#2a2e39;--ink:#d1d4dc;--ink2:#868b98;
    --up:#26a69a;--down:#ef5350;--amber:#f0b90b;--accent:#2962ff;
    --mono:ui-monospace,"Consolas",monospace;--f:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .brand{font-weight:800}.brand b{color:var(--amber)}
  .conn{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:6px;background:var(--panel)}
  .conn.ok{color:var(--up)}.conn.off{color:var(--down)}
  main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
  .row{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
  .row .v{font-family:var(--mono);font-weight:600}
  .up{color:var(--up)}.down{color:var(--down)}.amb{color:var(--amber)}.muted{color:var(--ink2)}
  table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
  td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
  th{color:var(--ink2);font-weight:600;font-size:10px;text-transform:uppercase}
  .big{font-size:26px;font-family:var(--mono);font-weight:700}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:11px}
  .pill.ok{background:#13322a;color:var(--up)}.pill.block{background:#361e1b;color:var(--down)}
  .note{grid-column:1/-1;color:var(--ink2);font-family:var(--mono);font-size:11px;text-align:center}
  .meter{height:8px;border-radius:5px;background:#222a3a;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%}
  .gauge{position:relative;height:10px;border-radius:5px;margin:8px 0 4px;
    background:linear-gradient(90deg,var(--down) 0%,#3a3f4b 50%,var(--up) 100%)}
  .gauge b{position:absolute;top:-3px;width:3px;height:16px;border-radius:2px;background:var(--ink);
    box-shadow:0 0 0 2px var(--panel)}
  .gauge s{position:absolute;top:-2px;left:50%;width:1px;height:14px;background:var(--ink2);opacity:.6}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chip{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:#222a3a;color:var(--ink2)}
  .chip b{color:var(--ink);font-weight:600}
  .warn{color:var(--ink2);font-size:10px;line-height:1.4;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
</style>
</head>
<body>
<header>
  <span class="brand">LDZ <b>GOLD MASTER</b> · En vivo</span>
  <span class="conn off" id="conn">conectando…</span>
  <span class="muted" id="clock" style="margin-left:auto;font-family:var(--mono)"></span>
</header>
<main>
  <div class="card"><h3>Cuenta</h3><div id="acct"></div></div>
  <div class="card"><h3>Guardián de riesgo</h3><div id="guard"></div></div>
  <div class="card"><h3>Flujo &amp; DXY</h3><div id="flow"></div></div>
  <div class="card"><h3>Posiciones</h3><div id="pos"></div></div>
  <div class="card"><h3>Pronóstico H4</h3><div id="fc"></div></div>
  <div class="card"><h3>Sentimiento del oro</h3><div id="sent"></div></div>
  <div class="card"><h3>Diario (aprende de ti)</h3><div id="journal"></div></div>
  <div class="note" id="src"></div>
</main>
<script>
const API = location.origin.startsWith("http") && location.port!=="" ? "" : "http://127.0.0.1:8777";
const $=id=>document.getElementById(id);
const fmt=(x,d=2)=>x==null?"—":Number(x).toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d});
const rows=o=>Object.entries(o).map(([k,v])=>`<div class="row"><span class="muted">${k}</span><span class="v">${v}</span></div>`).join("");

async function get(p){ try{const r=await fetch(API+p); return await r.json();}catch(e){return {source:"offline",_err:String(e)};} }

async function tick(){
  $("clock").textContent=new Date().toLocaleTimeString("es");
  const s=await get("/api/snapshot");
  const live = s && s.status && (s.status.mt5 || (s.account&&s.account.source==="bridge"));
  $("conn").className="conn "+(s._err?"off":(live?"ok":"off"));
  $("conn").textContent = s._err?"API apagado (arranca uvicorn gm_live_api)":(live?"● en vivo · "+s.account.source:"○ offline · arranca MT5/servicios");
  if(s._err){ return; }
  // cuenta
  const a=s.account||{};
  $("acct").innerHTML = a.source==="offline" ? `<div class="muted">${a.message||"sin datos"}</div>` :
    `<div class="big ${(a.equity||0)>=(a.balance||0)?'up':'down'}">$${fmt(a.equity)}</div>`+
    rows({balance:"$"+fmt(a.balance??a.equity),"flotante":(a.profit>=0?'+':'')+"$"+fmt(a.profit||0),"margen libre":"$"+fmt(a.margin_free||0)});
  // guardián (evaluar un trade tipo con el equity real)
  const eq=a.equity||a.balance||10;
  const reg=(s.flow&&s.flow.composite!=null)?"normal":"normal";
  const g=await (await fetch(API+"/api/guardian/evaluate",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({equity:eq,stop_distance:4,ctx:{regime:reg,spread_points:(s.flow&&s.flow.spread)||20}})})).json().catch(()=>({allow:false,reason:"api"}));
  $("guard").innerHTML = `<div class="row"><span>Etapa</span><span class="pill ok">${g.stage||"—"}</span></div>`+
    `<div class="row"><span>¿Operar ahora?</span><span class="pill ${g.allow?'ok':'block'}">${g.allow?'PERMITIDO':'BLOQUEADO'}</span></div>`+
    `<div class="row"><span class="muted">${g.allow?('lote '+fmt(g.lot)+' · riesgo $'+fmt(g.risk_usd)+' ('+fmt(g.risk_pct,1)+'%)'):g.reason}</span></div>`+
    `<div class="row"><span>Score setup</span><span class="v">${g.score??'—'}/100</span></div>`+
    `<div class="meter"><i style="width:${g.score||0}%;background:${(g.score||0)>=60?'var(--up)':'var(--amber)'}"></i></div>`;
  // flujo + dxy
  const f=s.flow||{};
  $("flow").innerHTML = f.source==="offline" ? `<div class="muted">${f.message||"sin intel/micro"}</div>` :
    rows({CVD:f.cvd??"—",VPIN:f.vpin??"—",VWAP:f.vwap??"—",POC:f.poc??"—","DXY ρ":f.dxy_corr??"—","DXY shock":f.dxy_shock??"—"});
  // posiciones
  const ps=s.positions||[];
  $("pos").innerHTML = ps.length? `<table><tr><th>Lado</th><th>Lote</th><th>Entrada</th><th>P&L</th></tr>`+
    ps.map(p=>`<tr><td class="${p.side==='BUY'?'up':'down'}">${p.side}</td><td>${fmt(p.volume)}</td><td>${fmt(p.price_open)}</td><td class="${p.profit>=0?'up':'down'}">$${fmt(p.profit)}</td></tr>`).join("")+`</table>` : `<div class="muted">sin posiciones abiertas</div>`;
  // pronóstico
  const fcr=await get("/api/forecast");
  if(fcr.forecast&&fcr.forecast.length){ const h=fcr.forecast;
    $("fc").innerHTML=h.map((x,i)=>`<div class="row"><span>H4+${i+1}</span><span class="v">C ${fmt(x.median_close??x.h4?.close)} · ${fmt(x.p10)}–${fmt(x.p90)}</span></div>`).join("")+
      `<div class="row"><span class="muted">banda acierta ${fcr.calibration?.band_coverage_pct??'—'}% · dirección ${fcr.calibration?.direction_hit_pct??'—'}% (azar)</span></div>`;
  } else $("fc").innerHTML=`<div class="muted">${fcr.message||"ejecuta gm_forecast"}</div>`;
  // sentimiento (indice diario; el API lo cachea 10 min)
  const sn = s.sentiment || await get("/api/sentiment");
  if(sn && sn.source==="calculado"){
    const v=Number(sn.compuesto)||0, pos=(v+100)/2;
    const col = v>=20?'var(--up)':(v<=-20?'var(--down)':'var(--amber)');
    $("sent").innerHTML =
      `<div class="big" style="color:${col}">${v>0?'+':''}${fmt(v,1)}</div>`+
      `<div class="row"><span class="muted">${sn.etiqueta||''}</span>`+
      `<span class="muted">${sn.n_componentes||0} comp.</span></div>`+
      `<div class="gauge"><s></s><b style="left:calc(${pos}% - 1.5px)"></b></div>`+
      `<div class="row"><span class="muted" style="font-size:10px">bajista</span>`+
      `<span class="muted" style="font-size:10px">alcista</span></div>`+
      `<div class="chips">`+Object.entries(sn.componentes_z||{})
        .filter(([,z])=>z!==null&&z!==undefined)
        .map(([k,z])=>`<span class="chip">${k} <b>${z>0?'+':''}${fmt(z,1)}</b></span>`).join("")+`</div>`+
      (sn.fuentes_ausentes&&sn.fuentes_ausentes.length
        ? `<div class="warn">Sin ${sn.fuentes_ausentes.join(", ")}. Calculado con ${sn.n_componentes} componentes.</div>`:``)+
      `<div class="warn">Describe el estado del mercado; NO lo anticipa (medido: 0,53 sigma). Contexto, no senal.</div>`;
  } else $("sent").innerHTML=`<div class="muted">${(sn&&sn.message)||"sin datos de sentimiento"}</div>`;
  // diario
  const j=await get("/api/journal");
  $("journal").innerHTML = (j.n||0)? rows({"operaciones":j.n,"aciertos":(j.win_rate??"—")+"%","esperanza":(j.expectancy_R??"—")+"R","neto":"$"+fmt(j.net_usd)}) :
    `<div class="muted">aún sin operaciones registradas. Cada trade con contexto alimenta el modelo que aprende TU edge.</div>`;
  $("src").textContent=`fuentes: cuenta=${a.source||'?'} · flujo=${f.source||'?'} · MT5=${s.status?.mt5?'sí':'no'} · ${new Date().toLocaleTimeString("es")}`;
}
tick(); setInterval(tick,2000);
</script>
</body>
</html>
